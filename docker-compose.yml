services:
  db:
    image: mysql:8.0
    container_name: outorga-mysql
    restart: unless-stopped
    # Banco local isolado do portal de agendamento: mysql://root:root@localhost:3307/outorga
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: outorga
    ports:
      - "3307:3306"
    volumes:
      - outorga-mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  outorga-mysql-data:
